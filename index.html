<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Таро</title>
  <style>
    :root { --bg: #07051a; --ink: #f4ecff; --muted: #a89a80; --gold: #d9b45a; --gold-soft: rgba(217, 180, 90, 0.25); }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: Georgia, "Times New Roman", serif; }
    main { height: 100%; display: grid; place-items: center; box-sizing: border-box;
      padding: env(safe-area-inset-top, 0px) max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
    .stage { position: relative; width: min(100%, calc(100vh * 600 / 1010)); aspect-ratio: 600 / 1010; max-width: 100%; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }

    /* the preloader covers the stage until the deck has arrived, then offers the way in */
    .gate { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px;
      background: radial-gradient(120% 70% at 50% 30%, #241a52 0%, #120b2e 55%, var(--bg) 100%);
      transition: opacity 0.6s ease; }
    .gate.leaving { opacity: 0; pointer-events: none; }
    .sigil { width: 128px; height: 128px; position: relative; }
    .sigil svg { width: 100%; height: 100%; display: block; }
    .orbit { transform-origin: 50% 50%; animation: turn 6s linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    .caption { margin: 0; color: var(--gold); font-size: 22px; letter-spacing: 0.06em; text-align: center; min-height: 1.3em; }
    .meter { width: 220px; display: grid; gap: 8px; justify-items: center; }
    .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--gold-soft); overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0%; background: var(--gold); transition: width 0.2s ease; }
    .bar.unknown span { width: 30%; animation: sweep 1.4s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    .percent { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
    .enter { border: 1px solid var(--gold); background: linear-gradient(#ffe7a0, #b8862e); color: #1a1033;
      font: 22px/1 Georgia, serif; letter-spacing: 0.04em; padding: 16px 34px; border-radius: 999px; cursor: pointer; }
    .enter:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    .note { max-width: 30ch; text-align: center; color: var(--ink); }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      .orbit, .bar.unknown span { animation: none; }
      .gate { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="stage" id="stage">
      <canvas id="tarot" width="600" height="1010" aria-label="Таро: розклад на три карти"></canvas>
      <div class="gate" id="gate" role="status" aria-live="polite">
        <div class="sigil" aria-hidden="true">
          <svg viewBox="0 0 128 128">
            <g class="orbit" fill="none" stroke="#d9b45a">
              <circle cx="64" cy="64" r="58" stroke-width="1.5" stroke-dasharray="2 7" />
              <circle cx="64" cy="6" r="4" fill="#d9b45a" stroke="none" />
              <path d="M64 118 l4 -6 l-4 -6 l-4 6 z" fill="#d9b45a" stroke="none" />
            </g>
            <circle cx="64" cy="64" r="44" fill="none" stroke="#d9b45a" stroke-opacity="0.45" stroke-width="1" />
            <g stroke="#d9b45a" stroke-width="2" stroke-linecap="round">
              <line x1="64" y1="28" x2="64" y2="36" /><line x1="64" y1="92" x2="64" y2="100" />
              <line x1="28" y1="64" x2="36" y2="64" /><line x1="92" y1="64" x2="100" y2="64" />
              <line x1="39" y1="39" x2="45" y2="45" /><line x1="83" y1="83" x2="89" y2="89" />
              <line x1="89" y1="39" x2="83" y2="45" /><line x1="45" y1="83" x2="39" y2="89" />
            </g>
            <circle cx="64" cy="64" r="16" fill="#d9b45a" />
            <path d="M58 70 a12 12 0 1 0 14 -16 a9 9 0 1 1 -14 16 z" fill="#120b2e" />
          </svg>
        </div>
        <p class="caption" id="caption">Колода тасується…</p>
        <div class="meter" id="meter">
          <div class="bar unknown" id="bar"><span></span></div>
          <div class="percent" id="percent"></div>
        </div>
        <button class="enter" id="enter" type="button" hidden>Увійти до ворожки</button>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2@2.44.2/rive.js"></script>
  <script>
    const stage = document.getElementById("stage");
    const gate = document.getElementById("gate");
    const caption = document.getElementById("caption");
    const bar = document.getElementById("bar");
    const percent = document.getElementById("percent");
    const enter = document.getElementById("enter");
    const canvas = document.getElementById("tarot");
    let tarot = null;

    function showProgress(loaded, total) {
      if (!total) {
        percent.textContent = (loaded / 1048576).toFixed(1) + " МБ";
        return;
      }
      bar.classList.remove("unknown");
      const p = Math.min(100, Math.round((loaded / total) * 100));
      bar.firstElementChild.style.width = p + "%";
      percent.textContent = p + "%";
    }

    // fetch the .riv ourselves so the preloader can show real progress
    async function fetchDeck(url) {
      const res = await fetch(url);
      if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
      const total = Number(res.headers.get("content-length")) || 0;
      const reader = res.body.getReader();
      const chunks = [];
      let loaded = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        showProgress(loaded, total);
      }
      const bytes = new Uint8Array(loaded);
      let at = 0;
      for (const c of chunks) { bytes.set(c, at); at += c.length; }
      return bytes.buffer;
    }

    function ready() {
      caption.textContent = "Карти чекають на тебе";
      document.getElementById("meter").hidden = true;
      enter.hidden = false;
      enter.focus();
    }

    function failed() {
      gate.innerHTML = '<p class="note">Карти не завантажились. Онови сторінку; якщо не допоможе, відкрий її в Chrome або Safari.</p>';
    }

    fetchDeck("tarot.riv")
      .then((buffer) => {
        caption.textContent = "Свічки запалюються…";
        tarot = new rive.Rive({
          buffer,
          canvas,
          stateMachine: "Tarot",
          autoplay: true,
          autoBind: true,
          layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
          onLoad: () => { tarot.resizeDrawingSurfaceToCanvas(); ready(); },
          onLoadError: failed,
        });
        window.addEventListener("resize", () => tarot.resizeDrawingSurfaceToCanvas());
      })
      .catch(failed);

    // Phones: play with the silent switch on, and unlock audio inside the tap itself.
    function unlockAudio() {
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
      new Audio("data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA").play().catch(() => {});
    }
    enter.addEventListener("click", () => {
      unlockAudio();
      gate.classList.add("leaving");
      setTimeout(() => gate.remove(), 650);
    });
  </script>
</body>
</html>
